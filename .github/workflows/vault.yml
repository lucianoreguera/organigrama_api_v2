name: Deploy a Producción

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-main:
    name: Deploy Producción
    runs-on: [self-hosted, server2]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build & Push imagen Docker
        run: |      
              echo "Repository downloaded successfully."            
              docker stop organigrama_surrealdb || true
              docker rm organigrama_surrealdb || true 
              docker rmi organigrama_surrealdb:latest || true       
              docker build -t organigrama_api_v2:latest . 
              docker run -d --restart=always \               
                -e MONGODB='${{ secrets.MONGODB }}' \
                -e PORT='${{ secrets.PORT }}' \
                -e KEYCLOAK_BASE_URL='${{ secrets.KEYCLOAK_BASE_URL }}' \
                -e KEYCLOAK_REALM='${{ secrets.KEYCLOAK_REALM }}' \
                -e KEYCLOAK_CLIENT_ID='${{ secrets.KEYCLOAK_CLIENT_ID }}' \
                -e KEYCLOAK_CLIENT_SECRET='${{ secrets.KEYCLOAK_CLIENT_SECRET }}' \
                -e KEYCLOAK_ADMIN_USERNAME='${{ secrets.KEYCLOAK_ADMIN_USERNAME }}' \
                -e KEYCLOAK_ADMIN_PASSWORD='${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}' \
                -e S3_API_URL='${{ secrets.S3_API_URL }}' \
                -e S3_FOLDER='${{ secrets.S3_FOLDER }}' \
                -e S3_API_KEY='${{ secrets.S3_API_KEY }}' \
                -p 0.0.0.0:7053:3000 --name organigrama_api_v2 organigrama_api_v2:latest
              docker logs organigrama_surrealdb
              exit
